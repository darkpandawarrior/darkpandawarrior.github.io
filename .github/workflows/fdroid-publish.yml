name: Publish F-Droid repo

# Builds darkpandawarrior.github.io/fdroid from the signed APKs attached to each
# app repo's GitHub Release, then deploys the whole site (portfolio + F-Droid
# repo) as a Pages artifact.
#
# Pages source must be set to "GitHub Actions", not "Deploy from a branch".
# APKs are downloaded at build time and never committed: GitHub rejects blobs
# over 100MB and one of these APKs is 115MB.

on:
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [app-released]
  schedule:
    - cron: '0 4 * * 1'   # Monday, catches releases cut without a dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fdroidserver
        # From PyPI, NOT apt. Ubuntu's fdroidserver package pins an androguard too
        # old to parse a resources.arsc produced by AGP 8/9: it dies with
        # "ResParserError: res1 must be zero!" on every modern APK.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner aapt libmagic1
          pip install --upgrade 'fdroidserver'
          fdroid --version
          python3 -c "import androguard; print('androguard', androguard.__version__)"

      - name: Fetch the latest signed APK for each app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo
          # Each app publishes exactly one FOSS-flavour APK per release.
          # Kursi and Mileway split gms/noGms; we take noGms. PaymentsLab has one flavour.
          # Matched with startswith/endswith rather than a regex: jq string literals
          # reject the \. escape a naive pattern needs, and this is unambiguous anyway.
          fetch() {
            repo="$1"; prefix="$2"
            tag=$(gh release view -R "darkpandawarrior/$repo" --json tagName -q .tagName)
            asset=$(gh release view -R "darkpandawarrior/$repo" --json assets \
                      -q ".assets[].name | select(startswith(\"$prefix\")) | select(endswith(\".apk\"))" | head -1)
            if [ -z "$asset" ]; then
              echo "::error::no asset starting with $prefix on $repo@$tag"
              return 1
            fi
            echo "$repo $tag -> $asset"
            gh release download -R "darkpandawarrior/$repo" "$tag" -p "$asset" -D fdroid/repo --clobber
          }
          # These names come from each repo's publish-fdroid workflow, which signs
          # the APK out of band. The per-variant assets from github-release.yml are
          # UNSIGNED and must never be picked up here.
          fetch Kursi       'Kursi-v'
          fetch Mileway     'Mileway-v'
          fetch PaymentsLab 'PaymentsLab-v'
          ls -lh fdroid/repo/

      - name: Reject unsigned APKs
        run: |
          set -euo pipefail
          fail=0
          for apk in fdroid/repo/*.apk; do
            if apksigner verify --print-certs "$apk" >/dev/null 2>&1; then
              echo "ok     $(basename "$apk")"
            else
              echo "::error::UNSIGNED, refusing to publish: $(basename "$apk")"
              fail=1
            fi
          done
          # An unsigned APK cannot be installed. Publishing one produces a repo
          # that looks healthy and serves an app nobody can install.
          exit $fail

      - name: Import each app's metadata and store copy
        # Without this, `fdroid update --create-metadata` invents metadata from the
        # APK alone: no licence, and crucially NO AntiFeatures, so an app bundling
        # proprietary SDKs would install with no warning shown. The authored ymls
        # live in each app repo, so pull them in here.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/metadata
          import_app() {
            repo="$1"; appid="$2"
            gh api "repos/darkpandawarrior/$repo/contents/metadata/$appid.yml" \
              --jq .content | base64 -d > "/tmp/$appid.src.yml"
            # Keep only the fields a local repo consumes. Binaries/Builds/AllowedAPKSigningKeys
            # are for a fdroiddata submission and mean nothing here.
            python3 - "$appid" <<'PYEOF'
          import sys, yaml, os
          appid = sys.argv[1]
          src = yaml.safe_load(open(f'/tmp/{appid}.src.yml')) or {}
          keep = ('License','AuthorName','AuthorEmail','WebSite','SourceCode',
                  'IssueTracker','Translation','Changelog','Categories',
                  'AntiFeatures','Donate','Liberapay','Name','AutoName')
          out = {k: src[k] for k in keep if k in src}
          with open(f'fdroid/metadata/{appid}.yml','w') as f:
              yaml.safe_dump(out, f, sort_keys=False, allow_unicode=True)
          print(appid, '->', ', '.join(out))
          PYEOF
            # Descriptions, changelogs and images, in the layout fdroid reads.
            d="fdroid/metadata/$appid/en-US"; mkdir -p "$d"
            tmp=$(mktemp -d)
            git clone -q --depth 1 --filter=blob:none --sparse \
              "https://github.com/darkpandawarrior/$repo.git" "$tmp"
            git -C "$tmp" sparse-checkout set fastlane/metadata/android/en-US
            fl="$tmp/fastlane/metadata/android/en-US"
            [ -f "$fl/short_description.txt" ] && cp "$fl/short_description.txt" "$d/summary.txt"
            [ -f "$fl/full_description.txt" ]  && cp "$fl/full_description.txt"  "$d/description.txt"
            [ -f "$fl/title.txt" ]             && cp "$fl/title.txt"             "$d/name.txt"
            [ -d "$fl/images" ]                && cp -r "$fl/images/." "$d/"
            [ -d "$fl/changelogs" ]            && cp -r "$fl/changelogs" "$d/changelogs"
            rm -rf "$tmp"
          }
          import_app Kursi       com.kursi.android
          import_app Mileway     com.mileway
          import_app PaymentsLab com.paymentslab.app
          find fdroid/metadata -maxdepth 2 | sort

      - name: Import each app's authored metadata
        working-directory: fdroid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/import-metadata.py

      - name: Materialise the index signing key
        env:
          KS_B64: ${{ secrets.FDROID_INDEX_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FDROID_INDEX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "::error::FDROID_INDEX_KEYSTORE_B64 is not set"; exit 1; }
          echo "$KS_B64" | base64 -d > fdroid/keystore.p12
          {
            echo "keystorepass: '$KS_PASS'"
            echo "keypass: '$KS_PASS'"
          } >> fdroid/config.yml

      - name: Build and sign the index
        working-directory: fdroid
        run: |
          set -euo pipefail
          mkdir -p repo/icons
          cp ../fdroid-icon.png repo/icons/icon.png 2>/dev/null || cp icon.png repo/icons/icon.png
          fdroid update --create-metadata --pretty --verbose
          test -f repo/index-v2.json || { echo "::error::fdroid update produced no index"; exit 1; }

      - name: Assemble the Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          # The existing portfolio site, minus build plumbing.
          rsync -a --exclude '.git' --exclude '_site' --exclude 'fdroid' \
                --exclude '.github' --exclude 'graphify-out' ./ _site/
          mkdir -p _site/fdroid
          cp -r fdroid/repo _site/fdroid/repo
          cp fdroid/README.md _site/fdroid/index.md 2>/dev/null || true
          rm -f _site/fdroid/keystore.p12
          # The keystore must never reach the published site.
          if find _site -name '*.p12' -o -name '*.jks' | grep -q .; then
            echo "::error::a keystore leaked into the artifact"; exit 1
          fi
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
